spring:
  application:
    name: petcure_backend

  datasource:
    url: jdbc:mysql://localhost:3306/britney?serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret-base64: ${JWT_SECRET}
    issuer: petcure-backend
    audience: petcure-api
    access-token-ttl-seconds: 1800
