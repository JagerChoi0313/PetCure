spring:
  application:
    name: petcure_backend

  datasource:
    url: jdbc:mysql://localhost:3306/britney?serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"

#   配置上传大小：文件保存到哪里，以及允许上传多大的文件
    servlet:
      multipart:
        max-file-size:5MB   #单个文件最多5MB
        max-request-size:6MB    #整个请求最多6MB，上传请求除了图片本身还有文件名、表单边界等额外内容，所以整个请求的上限略大
                                #超过限制时，框架会在进入上传Controller方法之前拒绝请求
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false

app:
  jwt:
    secret-base64: ${JWT_SECRET}
    issuer: petcure-backend
    audience: petcure-api
    access-token-ttl-seconds: 1800

# 配置存储目录
  storage:
    root-dir:"${PETCURE_STORAGE_ROOT:D:/PetCure-data/uploads}"
